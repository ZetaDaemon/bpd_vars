name: Release

on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Read project version
              id: version
              run: |
                  VERSION=$(python -c "import tomllib; print(tomllib.load(open('python/bpd_vars/pyproject.toml', 'rb'))['project']['version'])")
                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Check for existing release
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.VERSION }}
              run: |
                  if gh release view "v$VERSION" > /dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                    echo "Release v$VERSION already exists."
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "Release v$VERSION does not exist."
                  fi

            - name: Show release needed
              if: steps.release.outputs.exists == 'false'
              run: echo "A new release is needed."

            - name: Show release not needed
              if: steps.release.outputs.exists == 'true'
              run: echo "Release already exists. Nothing to do."
